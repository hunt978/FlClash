name: build

# Single-purpose workflow: build one release APK (android-arm64-v8a) by hand.
# Push events intentionally trigger nothing.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  build:
    name: Android arm64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      # No signing setup on purpose: without a keystore the app module falls
      # back to debug signing, so the release APK is built and signed
      # automatically with no secrets involved.
      - name: Build arm64 APK
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: dart setup.dart android --arch arm64 -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flclash-android-arm64
          path: ./dist
          overwrite: true
