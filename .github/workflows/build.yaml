name: build

# Single-purpose workflow: build one release APK (android-arm64-v8a) by hand.
# Push events intentionally trigger nothing.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  build:
    name: Android arm64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Cache the Go compiler cache so unchanged core sources skip recompiling.
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('core/go.sum') }}
          restore-keys: ${{ runner.os }}-go-build-

      # Cache pub packages; pubspec.lock pins exact versions.
      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      # Cache the NDK zip itself; unzipping locally is far cheaper than
      # re-downloading it from dl.google.com on every run.
      - name: Cache NDK
        uses: actions/cache@v4
        id: ndk-cache
        with:
          path: ndk-${{ env.NDK_VERSION }}.zip
          key: ${{ runner.os }}-ndk-${{ env.NDK_VERSION }}

      - name: Download NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: curl -fL --retry 3 -o "ndk-${{ env.NDK_VERSION }}.zip" "https://dl.google.com/android/repository/android-ndk-${{ env.NDK_VERSION }}-linux.zip"

      - name: Install NDK
        run: |
          unzip -q -o "ndk-${{ env.NDK_VERSION }}.zip"
          echo "${GITHUB_WORKSPACE}/android-ndk-${{ env.NDK_VERSION }}" >> "$GITHUB_PATH"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      # No signing setup on purpose: without a keystore the app module falls
      # back to debug signing, so the release APK is built and signed
      # automatically with no secrets involved.
      - name: Build arm64 APK
        env:
          ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk-${{ env.NDK_VERSION }}
        run: dart setup.dart android --arch arm64 -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flclash-android-arm64
          path: ./dist
          overwrite: true
